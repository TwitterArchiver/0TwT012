  后来去了许多寺庙。
  <br/>
  在低眉的菩萨前，那些珍藏的回忆同供香一起燃烧。一半变做烟尘往上飘，一半烧成灰烬向下落。
  <br/>
  我想了太多话，比思念更长，长过那年青灰色的雨季。可握笔时指尖总是颤抖，写着写着，又变回一句“岁岁平安”。
  <br/>
  你在时间洪流里的色彩太鲜明，像白雪和群山间飘动的经幡，所以才配得上如此空泛且平庸的祝福。
  <br/>
  盛起拥有的一切，又补足失去的一切。
  <br/>
  斗拱下黄铜的转经筒在渴望中长出痕迹，而我也曾在爱中被雕刻。纠缠不休的尘寰与缘分间，结局早已写定。若说贪恋，不过是曾经看进你深远的眼睛。
