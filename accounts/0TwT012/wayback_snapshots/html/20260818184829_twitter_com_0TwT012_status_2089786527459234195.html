  沉迷于短暂的浪漫关系会让我丧失爱人的能力吗？
  <br/>
  我觉得并不会的。
  <br/>
  爱人是一项长期习得的技能，我知道对方会想要什么，也知道自己能够给予什么。

  <br/>
  当我处于自洽的生活状态时，我只需要睡个好觉。
  <br/>

  <br/>
  我们不说地久天长，不说未到的未来，不说真心，不问过去，只在当下的当下做一对爱侣，接吻、喘息、做爱、相拥而眠，好不好？
