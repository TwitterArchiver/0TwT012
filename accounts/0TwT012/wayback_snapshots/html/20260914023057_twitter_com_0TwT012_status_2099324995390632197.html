  关于我为什么会写东西，因为很久以前开始我发现自己口头表达的能力特别差，于是开始在纸上写，有手机之后开始写电子日记。一写就是很多年，有很多人因为我写的东西而喜欢也有人讨厌我恨我。
  <br/>
  我是一个自毁倾向很严重的人，意识到这个问题的时候，好像很多事都有了眉目。我对几乎所有的事所有的人都是极度坦诚的，这也导致总是有人喜欢在我揭开的伤口里戳来戳去。不过好处是，时间长了再也没人能戳得动，极度的坦诚再也伤害不到我，反而成为了筛选环境和人的利器。这么多年一直在过着一种没有明天的生活，那些没能杀死我的东西，变成了生成大家所看到的文字。
  <br/>
  <br/>
  我一直希望我能在迷茫和痛苦中杀出一条血路。
