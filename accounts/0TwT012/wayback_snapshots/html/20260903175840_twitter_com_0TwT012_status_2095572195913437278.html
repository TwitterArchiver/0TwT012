  上学是离奇枯燥乏味的生活，之前对此时的我是这样的，每天日复一日的起床、上学、下学、睡觉，重复百遍千遍万遍，直至成为肌肉记忆在某次空闲的假期依旧呆滞的进行程序，又恍惚意识到自己已经从第一场轮回中解脱。

  <br/>
